<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>ProdManager - Matéria-Prima</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/base.css" />
</head>
<body class="bg-background text-on-surface font-body-md h-screen overflow-hidden flex">
<nav class="hidden md:flex bg-surface fixed left-0 h-screen w-64 border-r border-outline-variant flex-col py-6 px-4 z-40">
  <div class="mb-8 px-2 flex items-center gap-3">
    <div class="w-8 h-8 rounded bg-primary-container text-on-primary flex items-center justify-center"><span class="material-symbols-outlined">domain</span></div>
    <h1 class="font-headline-md text-headline-md font-bold text-primary">ProdManager</h1>
  </div>
  <ul class="flex flex-col gap-1 flex-1">
    <li><a class="flex items-center gap-3 px-3 py-2.5 rounded text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-colors" href="dashboard.html"><span class="material-symbols-outlined">dashboard</span>Dashboard</a></li>
    <li><a class="flex items-center gap-3 px-3 py-2.5 rounded text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-colors" href="clientes.html"><span class="material-symbols-outlined">groups</span>Clientes</a></li>
    <li><a class="flex items-center gap-3 px-3 py-2.5 rounded text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-colors" href="pedidos.html"><span class="material-symbols-outlined">receipt_long</span>Pedidos</a></li>
    <li><a class="flex items-center gap-3 px-3 py-2.5 rounded text-body-md text-primary font-bold border-r-2 border-primary bg-surface-container-low" href="materia-prima.html"><span class="material-symbols-outlined">inventory_2</span>Matéria-Prima</a></li>
  </ul>
  <ul class="flex flex-col gap-1 mt-auto pt-4 border-t border-outline-variant">
    <li><a class="flex items-center gap-3 px-3 py-2.5 rounded text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-colors" href="#" data-logout><span class="material-symbols-outlined">logout</span>Sair</a></li>
  </ul>
</nav>

<div class="flex-1 flex flex-col ml-0 md:ml-64 h-screen overflow-hidden">
  <header class="bg-surface border-b border-outline-variant flex justify-between items-center h-16 px-6 z-30 flex-shrink-0">
    <div class="relative hidden sm:block w-64">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
      <input id="search-input" class="w-full h-9 pl-9 pr-3 rounded border border-outline-variant bg-surface-container-lowest text-body-md outline-none focus:border-primary-container" placeholder="Filtrar por nome..." type="text" />
    </div>
    <div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center font-bold text-on-surface-variant" data-user-initial>U</div>
  </header>

  <main class="flex-1 overflow-y-auto p-gutter">
    <div class="max-w-7xl mx-auto flex flex-col gap-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="font-headline-lg text-headline-lg text-on-surface">Matéria-Prima</h2>
          <p class="font-body-md text-body-md text-on-surface-variant mt-1">Controle de estoque de insumos.</p>
        </div>
        <button id="btn-new-material" class="h-9 px-4 bg-primary-container text-on-primary rounded-lg flex items-center gap-2 hover:bg-primary transition-colors font-label-md text-label-md">
          <span class="material-symbols-outlined text-[18px]">add</span> Adicionar Material
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-4 xl:grid-cols-5 gap-6">
        <div class="lg:col-span-4 xl:col-span-4 bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden ambient-shadow">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-low border-b border-outline-variant">
                <th class="h-[48px] px-4 font-label-md text-label-md text-on-surface-variant uppercase w-20">ID</th>
                <th class="h-[48px] px-4 font-label-md text-label-md text-on-surface-variant uppercase">Material</th>
                <th class="h-[48px] px-4 font-label-md text-label-md text-on-surface-variant uppercase">Estoque Atual</th>
                <th class="h-[48px] px-4 font-label-md text-label-md text-on-surface-variant uppercase">Status</th>
                <th class="h-[48px] px-4 font-label-md text-label-md text-on-surface-variant uppercase text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="materiais-body">
              <tr><td class="h-[48px] px-4 text-on-surface-variant" colspan="5">Carregando...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="lg:col-span-4 xl:col-span-1 bg-surface-container-lowest border border-outline-variant rounded-xl p-6 sticky top-6 ambient-shadow hidden" id="details-card">
          <div class="flex justify-between items-start mb-4">
            <div>
              <div class="font-code-sm text-code-sm text-primary mb-1" id="detail-id">—</div>
              <h3 class="font-headline-md text-headline-md text-on-surface text-[18px]" id="detail-name">—</h3>
            </div>
            <button class="text-on-surface-variant hover:text-on-surface" id="detail-close"><span class="material-symbols-outlined">close</span></button>
          </div>
          <p class="font-body-md text-body-md text-on-surface mb-4" id="detail-desc"></p>
          <label class="block font-label-md text-label-md text-on-surface-variant uppercase mb-2">Ajustar Estoque</label>
          <div class="flex items-center gap-2 mb-4">
            <button class="w-10 h-10 flex items-center justify-center rounded border border-outline-variant hover:bg-surface-container-low" id="stock-decrease" type="button">
              <span class="material-symbols-outlined">remove</span>
            </button>
            <div class="relative flex-1">
              <input class="w-full h-10 text-center font-headline-md text-headline-md text-[16px] text-on-surface bg-surface-container-lowest border border-outline-variant rounded focus:border-primary" id="quick-stock-input" type="number" min="0" />
              <span class="absolute right-3 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant" id="detail-unit"></span>
            </div>
            <button class="w-10 h-10 flex items-center justify-center rounded border border-outline-variant hover:bg-surface-container-low" id="stock-increase" type="button">
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
          <button class="w-full bg-primary text-on-primary h-[36px] rounded flex items-center justify-center gap-2 font-label-md text-label-md hover:bg-primary/90 transition-colors" id="stock-save">
            Salvar
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal: Novo Material -->
<div class="modal-overlay" id="material-modal">
  <div class="modal-card">
    <div class="px-6 py-4 border-b border-outline-variant flex items-center justify-between">
      <h3 class="font-title-md text-title-md text-on-surface">Novo Material</h3>
      <button class="text-on-surface-variant hover:text-on-surface w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low" id="material-modal-close" type="button">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="material-form" class="p-6 flex flex-col gap-4" novalidate>
      <div id="material-form-error" class="form-error" role="alert">
        <span class="material-symbols-outlined text-[20px]">error</span>
        <span id="material-form-error-text"></span>
      </div>
      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="material-nome">Nome</label>
        <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface-container-lowest text-body-md outline-none focus:border-primary" id="material-nome" required type="text" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="material-descricao">Descrição</label>
        <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface-container-lowest text-body-md outline-none focus:border-primary" id="material-descricao" type="text" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="material-qtd">Quantidade</label>
          <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface-container-lowest text-body-md outline-none focus:border-primary" id="material-qtd" required type="number" min="0" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="material-unidade">Unidade</label>
          <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface-container-lowest text-body-md outline-none focus:border-primary" id="material-unidade" required type="text" placeholder="kg, un, m..." />
        </div>
      </div>
      <div class="flex gap-3 mt-2">
        <button type="button" id="material-form-cancel" class="flex-1 h-10 border border-outline-variant text-on-surface font-title-md rounded hover:bg-surface-container-low transition-colors">Cancelar</button>
        <button type="submit" id="material-form-submit" class="flex-1 h-10 bg-primary-container text-on-primary font-title-md rounded hover:bg-primary transition-colors">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/materia-prima.js"></script>
</body>
</html>
